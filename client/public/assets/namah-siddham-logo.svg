<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE00" />
      <stop offset="60%" stop-color="#F28C00" />
      <stop offset="100%" stop-color="#0756B8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD926" />
      <stop offset="100%" stop-color="#FFBE00" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0756B8" />
      <stop offset="100%" stop-color="#053C83" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0756B8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM GROUP (Transparent Background) -->
  <g transform="translate(10, 10)">
    <!-- Dynamic Orbit Ring -->
    <ellipse cx="50" cy="50" rx="44" ry="24" transform="rotate(-28 50 50)" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-dasharray="210 20" stroke-linecap="round" />
    
    <!-- Dynamic Growth Arrow on the Orbit -->
    <path d="M 85 24 L 95 18 L 89 31 Z" fill="#F28C00" stroke="#F28C00" stroke-width="1" stroke-linejoin="round" />

    <!-- Center Protective Aura / Circle Shield -->
    <circle cx="50" cy="50" r="36" fill="url(#blueGrad)" filter="url(#subtleGlow)" />
    <circle cx="50" cy="50" r="34" fill="none" stroke="#FFBE00" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Jain Emblem Elements Inside Emblem -->
    <!-- Ratnatraya (Three Dots) -->
    <circle cx="43" cy="27" r="2.2" fill="#FFBE00" />
    <circle cx="50" cy="25" r="2.2" fill="#FFBE00" />
    <circle cx="57" cy="27" r="2.2" fill="#FFBE00" />

    <!-- Crescent Moon & Siddha Shila Dot -->
    <path d="M 42 22 Q 50 25 58 22 Q 50 28 42 22 Z" fill="#FFFFFF" />
    <circle cx="50" cy="20" r="1.8" fill="#FFBE00" />

    <!-- Ahimsa Hand Icon Silhouette -->
    <g transform="translate(32, 28) scale(0.72)">
      <!-- Palm -->
      <path d="M 25 22 C 22 20, 16 23, 16 28 L 16 38 C 16 45, 23 54, 32 54 C 41 54, 48 45, 48 38 L 48 27 C 48 24, 45 22, 42 23 C 40 23, 39 25, 39 28 L 39 22 C 39 19, 36 17, 33 18 C 31 18, 30 20, 30 22 L 30 18 C 30 15, 27 13, 24 14 C 22 14, 21 16, 21 19 L 21 28 Z" fill="#FFFFFF" opacity="0.95" />
      
      <!-- Dharma Wheel / Chakra in Palm -->
      <circle cx="32" cy="38" r="9" fill="url(#goldGrad)" />
      <circle cx="32" cy="38" r="7.5" fill="#0756B8" />
      <circle cx="32" cy="38" r="2.5" fill="#FFBE00" />
      <!-- Spokes of Wheel -->
      <line x1="32" y1="29" x2="32" y2="47" stroke="#FFBE00" stroke-width="1.2" />
      <line x1="23" y1="38" x2="41" y2="38" stroke="#FFBE00" stroke-width="1.2" />
      <line x1="26" y1="32" x2="38" y2="44" stroke="#FFBE00" stroke-width="1.2" />
      <line x1="26" y1="44" x2="38" y2="32" stroke="#FFBE00" stroke-width="1.2" />
    </g>
  </g>

  <!-- TYPOGRAPHY / LETTERING -->
  <g transform="translate(125, 20)">
    <!-- Primary Name -->
    <text x="0" y="42" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="#202B3C" letter-spacing="1.5">
      NAMAH SIDDHAM
    </text>
    
    <!-- Subtitle / Corporate Legal Entity -->
    <text x="2" y="66" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0756B8" letter-spacing="3.8">
      CORPORATION PRIVATE LIMITED
    </text>

    <!-- Two Verticals Micro Line -->
    <text x="3" y="83" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#F28C00" letter-spacing="1.5">
      IT SERVICES  •  DIGITAL PLATFORMS &amp; AGGREGATORS
    </text>
  </g>
</svg>
